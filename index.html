<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeple&Co - Inicio</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <!-- Link Icons -->
    <script src="https://kit.fontawesome.com/a8de2b40bc.js" crossorigin="anonymous"></script>

</head>
<body>
    <header class="header">

        <img class="logo" src="./assets/img/logo.svg" alt="Logo MeepleCo">

        <nav class="nav">

            <a class="nav-item" href="#">Inicio</a>
            <a class="nav-item" href="#">
                <div class="category-div">
                    Categorias
                    <i class="fa-solid fa-chevron-down fa-2xs"></i>
                </div>
            </a>
            <a class="nav-item" href="#">Sobre Nosotros</a>
            <a class="nav-item" href="#">Contacto</a>

        </nav>

        <div class="cart-section">

            <input class="search" type="search" placeholder="Search...">

            <i class="fa-solid fa-bell"></i>

            <i class="fa-solid fa-cart-shopping"></i>

            <img class="foto-perfil" src="./assets/img/foto-perfil.png" alt="Foto perfil">

        </div>

    </header>

    <main>

        <img class="banner" src="./assets/img/banner-1.webp" alt="Banner Inicial">

        <section class="board-category">

            <img class="banner-category" src="./assets/img/banner-juegos-tablero.png" alt="Banner juegos de tablero">

            <article class="items-board-category">

                <!-- Army of the dead -->
                <div class="item-card">

                    <div class="div-img">
                        <img class="board-img" src="./assets/img/boardgames/army_of_the_dead.png" alt="Army of the Dead">
                        <div class="div-heart">
                            <i class="fa-solid fa-heart"></i>
                        </div>
                    </div>

                    <div class="div-text">
                        <div class="div-info">
                            <p>Army of the dead</p>
                            <span class="editorial">CMON</span>
                            <span class="price">99.95€</span>
                        </div>
                        
                        <div class="div-btn">
                            <button class="add-to-cart-btn">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>

                </div>

                <!-- Catan -->
                <div class="item-card">

                    <div class="div-img">
                        <img class="board-img" src="./assets/img/boardgames/catan.png" alt="Catan el Juego">
                        <div class="div-heart">
                            <i class="fa-solid fa-heart"></i>
                        </div>
                    </div>

                    <div class="div-text">
                        <div class="div-info">
                            <p>Catan el Juego</p>
                            <span class="editorial">DEVIR</span>
                            <span class="price">40.50€</span>
                        </div>
                        
                        <div class="div-btn">
                            <button class="add-to-cart-btn">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>

                </div>

                <!-- Dune Imperium -->
                <div class="item-card">

                    <div class="div-img">
                        <img class="board-img" src="./assets/img/boardgames/dune_imperium.webp" alt="Dune Imperium Insurreción">
                        <div class="div-heart">
                            <i class="fa-solid fa-heart"></i>
                        </div>
                    </div>

                    <div class="div-text">
                        <div class="div-info">
                            <p>Dune Imperium: Insurreción</p>
                            <span class="editorial">ASMODE</span>
                            <span class="price">54.32€</span>
                        </div>
                        
                        <div class="div-btn">
                            <button class="add-to-cart-btn">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>

                </div>

                <!-- Atlantis Exodus -->
                <div class="item-card">

                    <div class="div-img">
                        <img class="board-img" src="./assets/img/boardgames/atlantis_exodus.jpg" alt="Atlantis Exodus">
                        <div class="div-heart">
                            <i class="fa-solid fa-heart"></i>
                        </div>
                    </div>

                    <div class="div-text">
                        <div class="div-info">
                            <p>Atlantis Exodus</p>
                            <span class="editorial">ARRAKIS GAMES</span>
                            <span class="price">58.75€</span>
                        </div>
                        
                        <div class="div-btn">
                            <button class="add-to-cart-btn">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>

                </div>

                <!-- Aventureros al tren -->
                <div class="item-card">

                    <div class="div-img">
                        <img class="board-img" src="./assets/img/boardgames/aventureros_al_tren.png" alt="Aventureros al tren">
                        <div class="div-heart">
                            <i class="fa-solid fa-heart"></i>
                        </div>
                    </div>

                    <div class="div-text">
                        <div class="div-info">
                            <p>Aventureros al tren</p>
                            <span class="editorial">ASMODE</span>
                            <span class="price">45.87€</span>
                        </div>
                        
                        <div class="div-btn">
                            <button class="add-to-cart-btn">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>

                </div>

            </article>

        </section>

    </main>
</body>
</html>
